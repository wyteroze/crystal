name: test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
env:
  ZIG_VERSION: 0.16.0
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  docs:
    name: Build Documentation
    runs-on: docker
    steps:
      - uses: actions/checkout@v3
      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build Documentation Linux
        run: zig build docs -Dtarget=x86_64-linux-gnu
      - name: Build Documentation Windows
        run: zig build docs -Dtarget=x86_64-windows
  examples:
    name: Build Examples
    runs-on: docker
    steps:
      - uses: actions/checkout@v3
      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build Examples Linux
        run: zig build examples -Dtarget=x86_64-linux-gnu
      - name: Build Examples Windows
        run: zig build examples -Dtarget=x86_64-windows
  gpu_examples:
    name: Build GPU Examples
    runs-on: docker
    steps:
      - uses: actions/checkout@v3
      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Tools
        run: apt update && apt install glslang-tools spirv-tools -y
      - name: Build Examples Linux Zig
        run: cd gpu_examples && zig build examples -Dtarget=x86_64-linux-gnu -Dshader_format=zig
      - name: Build Examples Linux HLSL
        run: cd gpu_examples && zig build examples -Dtarget=x86_64-linux-gnu -Dshader_format=hlsl
      - name: Build Examples Linux GLSL
        run: cd gpu_examples && zig build examples -Dtarget=x86_64-linux-gnu -Dshader_format=glsl
      - name: Build Examples Windows Zig
        run: cd gpu_examples && zig build examples -Dtarget=x86_64-windows -Dshader_format=zig
      - name: Build Examples Windows HLSL
        run: cd gpu_examples && zig build examples -Dtarget=x86_64-windows -Dshader_format=hlsl
      - name: Build Examples Windows GLSL
        run: cd gpu_examples && zig build examples -Dtarget=x86_64-windows -Dshader_format=glsl
  gpu_content_template:
    name: Build GPU Content Template
    runs-on: docker
    steps:
      - uses: actions/checkout@v3
      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build GPU Content Template Linux HLSL
        run: cd templates/gpu_content && zig build -Dtarget=x86_64-linux-gnu -Dshader_format=hlsl
      - name: Build GPU Content Template Windows HLSL
        run: cd templates/gpu_content && zig build -Dtarget=x86_64-windows -Dshader_format=hlsl
      - name: Install Tools
        run: apt update && apt install glslang-tools spirv-tools -y
      - name: Build GPU Content Template Linux Zig
        run: cd templates/gpu_content && zig build -Dtarget=x86_64-linux-gnu -Dshader_format=zig
      - name: Build GPU Content Template Linux GLSL
        run: cd templates/gpu_content && zig build -Dtarget=x86_64-linux-gnu -Dshader_format=glsl
      - name: Build GPU Content Template Windows Zig
        run: cd templates/gpu_content && zig build -Dtarget=x86_64-windows -Dshader_format=zig
      - name: Build GPU Content Template Windows GLSL
        run: cd templates/gpu_content && zig build -Dtarget=x86_64-windows -Dshader_format=glsl
  gpu_embedded_template:
    name: Build GPU Embedded Template
    runs-on: docker
    steps:
      - uses: actions/checkout@v3
      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Tools
        run: apt update && apt install glslang-tools spirv-tools -y
      - name: Build GPU Embedded Template Linux Zig
        run: cd templates/gpu_embedded && zig build -Dtarget=x86_64-linux-gnu -Dshader_format=zig
      - name: Build GPU Embedded Template Linux HLSL
        run: cd templates/gpu_embedded && zig build -Dtarget=x86_64-linux-gnu -Dshader_format=hlsl
      - name: Build GPU Embedded Template Linux GLSL
        run: cd templates/gpu_embedded && zig build -Dtarget=x86_64-linux-gnu -Dshader_format=glsl
      - name: Build GPU Embedded Template Windows Zig
        run: cd templates/gpu_embedded && zig build -Dtarget=x86_64-windows -Dshader_format=zig
      - name: Build GPU Embedded Template Windows HLSL
        run: cd templates/gpu_embedded && zig build -Dtarget=x86_64-windows -Dshader_format=hlsl
      - name: Build GPU Embedded Template Windows GLSL
        run: cd templates/gpu_embedded && zig build -Dtarget=x86_64-windows -Dshader_format=glsl
  renderer_template:
    name: Build Renderer Template
    runs-on: docker
    steps:
      - uses: actions/checkout@v3
      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build Renderer Template Linux
        run: cd templates/renderer && zig build -Dtarget=x86_64-linux-gnu
      - name: Build Renderer Template Windows
        run: cd templates/renderer && zig build -Dtarget=x86_64-windows
  test:
    name: Testing
    runs-on: docker
    steps:
      - uses: actions/checkout@v3
      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Testing Linux
        run: zig build test -Dtarget=x86_64-linux-gnu
      - name: Testing Windows
        run: zig build test -Dtarget=x86_64-linux-gnu -fwine
